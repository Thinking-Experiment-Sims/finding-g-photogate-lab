name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet - skipping."; fi
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.exists == 'true'
        run: npm ci
      - if: steps.app.outputs.exists == 'true'
        run: npm test
      - if: steps.app.outputs.exists == 'true'
        run: npm run build
